name: Build Legends Launcher

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to upload installers to a GitHub Release on tag builds

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build

      # Installed launchers compare package.json versions: a tag that doesn't match would
      # publish a release nobody updates to.
      - name: Check tag matches package.json version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)"; exit 1
          fi

      # Pushing a tag like v1.0.0 publishes the installer + latest.yml (used by auto-update)
      # to GitHub Releases. The website links to releases/latest/download/Legends-Launcher-Setup.exe.
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legends-Launcher-Windows
          path: dist/*.exe
